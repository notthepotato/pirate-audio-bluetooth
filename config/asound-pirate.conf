# >>> pirate-bluetooth >>>
# Added by the Pirate Audio Bluetooth add-on (removed again by its uninstall.sh).
# A software volume control in front of the Pirate Audio DAC, so the B/Y buttons work
# like a headphone-amp volume knob, separate from the phone's own volume.
pcm.pirate_out {
    type softvol
    slave.pcm "plughw:CARD=@CARD@,DEV=0"
    control {
        name "Pirate Headphone"
        card @CARD@
    }
    min_dB -50.0
    max_dB 0.0
}
# <<< pirate-bluetooth <<<
