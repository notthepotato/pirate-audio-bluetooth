# Pirate Audio Bluetooth add-on settings.
# After editing, restart it with:  systemctl --user restart pirate-bluetooth

[bluetooth]
# The name phones see in their Bluetooth list (or use: pirate-bluetooth name "New Name")
name = @NAME@
# How long pairing mode stays on
pair_seconds = 180
# Connect to the paired phone when the Pi is switched on, like headphones do
reconnect_on_start = yes
# How long to keep trying after power-on (seconds), in case the phone is still in your pocket or asleep
reconnect_seconds = 180
# Only with --keep-pimoroni-screen: after power-on, if your phone was what played last, the Bluetooth
# screen keeps the buttons this long (seconds) so the first press of A plays your phone.
boot_wait = 300
# Turn pairing mode on by itself when no phone has been paired yet
auto_pair_if_none = yes
# Album art for the phone's songs, kept per album so it shows offline next time:
# phone_art: the phone sends the cover itself over Bluetooth (Raspberry Pi OS Trixie; install.sh sets it up)
# art_lookup: otherwise look the cover up in Apple's iTunes catalogue when the Pi is online (only the
#             artist and album names are sent). Both no = colored cards instead.
phone_art = yes
art_lookup = yes
# Only with --keep-pimoroni-screen: seconds the phone can stay paused before Mopidy gets the screen back
handback_after = 60

[display]
# 90 is right for Pirate Audio; try 270 if the picture is upside down
rotation = 90
spi_mhz = 80
# Turn the screen off after this many seconds with nothing playing (0 = never). Any button wakes it.
sleep_after = 120

[buttons]
# Y is BCM 24 on boards made from 23 Jan 2020 onwards, BCM 20 on earlier boards
y_pin = @Y_PIN@
# Seconds to hold A (info screen) or X (previous track)
hold_time = 0.7

[volume]
# Percent per press of B / Y
step = 5
card = auto
control = Pirate Headphone
device = pirate_out

[mopidy]
# auto = share the screen and buttons with Pimoroni's Mopidy setup if it's installed
handoff = auto
# Mopidy's JSON-RPC address, used to save and restore its queue around Bluetooth sessions
rpc_url = http://127.0.0.1:6680/mopidy/rpc

[upload]
# The drag-and-drop music upload page: http://<your Pi>:<port>
enabled = @UPLOAD_ENABLED@
port = @UPLOAD_PORT@
# Where songs go (Pimoroni's Mopidy plays from ~/Music)
music_dir = ~/Music
# Set a password if you use the Pi on shared networks (campus, cafe...); empty = no password
password =
# Biggest single file, and how much space to always leave free on the Pi (MB)
max_file_mb = 2048
keep_free_mb = 500
# Refresh Mopidy's library this many seconds after the last upload ("auto" finds Mopidy by itself)
scan_delay = 8
scan_command = auto
# Playlists saved from the music page with "Keep it in sync": read the Apple Music playlist again this often (hours)
sync_hours = 6

[wifi]
# The Pi's own Wi-Fi hotspot, for when it can't join yours (or you're away from it). Switch it on in the menu
# (hold A > Wi-Fi hotspot) or with: pirate-bluetooth hotspot on. Join it on your phone or computer, then
# ssh <you>@10.42.0.1 or open http://10.42.0.1:<music page port>, where you can add a Wi-Fi for the Pi.
# Its name (empty = the Bluetooth name) and password (8 to 63 characters):
hotspot_name =
hotspot_password = @HOTSPOT_PASSWORD@
# It comes on by itself after this many minutes without Wi-Fi (0 = only from the menu)
hotspot_after_minutes = 3
# While nobody is connected to a hotspot that came on by itself, look for your Wi-Fi again this often (minutes)
retry_wifi_minutes = 5
# After editing: systemctl --user restart pirate-network
