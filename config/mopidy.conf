# Mopidy settings written by the Pirate Audio Bluetooth add-on's installer (fresh install).
# The add-on runs the Pirate Audio's screen and buttons itself, so Pimoroni's PiDi and raspberry-gpio
# extensions aren't needed. Change what you like; re-running install.sh keeps this file.

[core]
# The add-on remembers Mopidy's queue across reboots itself
restore_state = false

[audio]
mixer_volume = 40
# Play straight to the Pirate Audio's sound chip
output = alsasink device=plughw:CARD=@CARD@

[file]
enabled = true
media_dirs = @MUSIC_DIR@
show_dotfiles = false
excluded_file_extensions =
  .directory
  .html
  .jpeg
  .jpg
  .log
  .m3u
  .m3u8
  .nfo
  .pdf
  .png
  .txt
  .zip
follow_symlinks = false
metadata_timeout = 1000

[local]
enabled = true
media_dir = @MUSIC_DIR@
scan_timeout = 5000

[m3u]
playlists_dir = @MUSIC_DIR@/Playlists

[http]
hostname = 0.0.0.0
port = 6680
